<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>How JavaScript Works Behind the Scenes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        font-family: sans-serif;
        color: white;
        text-align: center; /* Center all text by default */

        /* [MODIFIED] Center content both vertically and horizontally */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2rem; /* Add space between the H1 and the main content */

        background: linear-gradient(to top left, #28b487, #7dd56f);
      }

      /* --- Typography --- */
      h1 {
        font-size: 50px;
        line-height: 1.3;
        /* [REMOVED] Removed fixed width and padding to let it center naturally */
      }

      h2 {
        margin-bottom: 1rem;
        color: #e0f2f1; /* Softer white for subheadings */
      }

      /* --- Layout Containers --- */
      .buttonsDiv {
        /* [MODIFIED] Let the parent div manage spacing with gap */
        display: flex;
        justify-content: center;
        align-items: stretch; /* Make all cards the same height */
        gap: 2rem;
        flex-wrap: wrap; /* Allows cards to wrap on smaller screens */
      }

      /* --- Card Styling --- */
      .action-card {
        /* [ADDED] Styling for the containers to make them look like cards */
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 1.5rem 2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        min-width: 250px;
      }

      /* --- Component Styling --- */
      button {
        /* [MODIFIED] Complete restyle of the button */
        padding: 0.75rem 1.5rem;
        font-weight: 700;
        color: #28b487; /* Match theme */
        background-color: white;
        border: 2px solid white;
        border-radius: 50px; /* Pill shape is more versatile */
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }

      button:hover {
        transform: translateY(-3px); /* Add a subtle hover effect */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      /* --- Poll Results Styling --- */
      .pollResults {
        /* [REMOVED] float: right is not needed in flexbox */
        text-align: left; /* Align the list items to the left for readability */
      }

      .pollResults ol {
        list-style-position: inside; /* Makes the list numbers align better */
      }

      .pollResults li {
        margin-bottom: 0.5rem;
        font-size: 1.1rem;
      }

      /* [ADDED] Class to toggle visibility using JavaScript */
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- [MOVED] The H1 is now at the top for proper document structure -->
    <h1>How JavaScript Works Behind the Scenes</h1>

    <div class="buttonsDiv">
      <!-- Added a container class for styling -->
      <div class="action-card">
        <h2>Buy Plane</h2>
        <button id="buy">Buy new Plane</button>
      </div>

      <!-- Added a container class for styling -->
      <div class="action-card poll">
        <h2>Take the Poll</h2>
        <button id="answer">Answer Poll</button>
        <button id="view">View Results</button>
      </div>

      <!-- Added a class to control visibility with JS -->
      <div class="action-card pollResults hidden">
        <h2>Results:</h2>
        <ol>
          <li>JavaScript =&nbsp;<span id="JavaScript"></span></li>
          <li>Python =&nbsp;<span id="Python"></span></li>
          <li>Rust =&nbsp;<span id="Rust"></span></li>
          <li>C++ =&nbsp;<span id="C++"></span></li>
        </ol>
        <button id="hidePollList">Hide</button>
      </div>
    </div>
    
    <script src="145.js"></script>
  </body>
</html>
